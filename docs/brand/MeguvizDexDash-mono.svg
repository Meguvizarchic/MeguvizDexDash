<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 72 72" role="img" aria-labelledby="title desc"><title id="title">MeguvizDexDash</title><desc id="desc">保留右侧扫描弧与左侧上下数据片。三片以同一外圆构建可见包络，扫描弧内外同心；横向与竖向切带统一4px，端点用解析相切圆角衔接，消除左下片独立缩放造成的外圆错位。</desc><g transform="translate(0.35616 0.35616) scale(1.11387)"><path fill="#4B3F63" d="M36.4 10.4444902635A22 22 0 0 1 36.4 53.5555097365A2 2 0 0 1 34 51.5959179423L34 44.9984614474A2 2 0 0 1 35.4117647059 43.0869229993A11.6 11.6 0 0 0 35.4117647059 20.9130770007A2 2 0 0 1 34 19.0015385526L34 12.4040820577A2 2 0 0 1 36.4 10.4444902635ZM27.6 53.5555097365A2 2 0 0 0 30 51.5959179423L30 36A2 2 0 0 0 28 34L12.4040820577 34A2 2 0 0 0 10.4444902635 36.4A22 22 0 0 0 27.6 53.5555097365Z"/><path fill="#4B3F63" d="M27.6 10.4444902635A2 2 0 0 1 30 12.4040820577L30 28A2 2 0 0 1 28 30L12.4040820577 30A2 2 0 0 1 10.4444902635 27.6A22 22 0 0 1 27.6 10.4444902635Z"/></g></svg>