# The desktop workbench is its own Cargo workspace on purpose: its UI toolkit brings several hundred
# crates, and the engine workspace, its Cargo.lock and its CI must not depend on them (ADR-desktop-shell).
[package]
name = "mdd-desktop"
version = "1.2.2"
edition = "2024"
rust-version = "1.99"
publish = false
description = "MeguvizDexDash desktop workbench: a thin shell over the meguvizdexdash MCP worker"

[workspace]

[build-dependencies]
tauri-build = "=2.7.5"

[dependencies]
tauri = "=2.12.6"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
