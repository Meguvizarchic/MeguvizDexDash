name: Desktop workbench
# MDD-073. The workbench is its own Cargo workspace (apps/desktop), so this runs beside the engine's CI and
# does not slow it. Each platform builds the engine and the window, runs the unit and process tests, makes the
# portable package, and then drives the REAL window from the unpacked package through the user flows of
# conformance/desktop/user-flow-cases.json (WebView2 over DevTools on Windows, WebKitGTK over WebDriver on Linux).
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      RECORDS: ${{ github.workspace }}/desktop-records
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Install WebKitGTK, GTK and the display and WebDriver tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev xvfb dbus-x11 webkit2gtk-driver
      - name: Record the environment
        run: |
          mkdir -p "$RECORDS"
          rustc -Vv
          cargo -V
          node --version
          python --version
      - name: Fixtures equal their generator
        run: python tests/fixtures/desktop/generate.py --check
      - name: Build the engine (debug, for the process tests)
        run: cargo build --locked -p mdd-cli
      - name: Format
        working-directory: apps/desktop
        run: cargo fmt --check
      - name: Fetch the window's locked dependencies
        working-directory: apps/desktop
        run: cargo fetch --locked
      - name: Lint
        working-directory: apps/desktop
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests (unit, and the shell against the real engine)
        working-directory: apps/desktop
        run: cargo test --locked -- --test-threads=2
      - name: Front-end tests
        working-directory: apps/desktop
        run: node --test ui-tests/*.test.mjs
      - name: Boundaries (no second core, no network crate, no broad permission)
        run: python apps/desktop/check_boundaries.py --record "$RECORDS/boundaries-${{ runner.os }}.json"
      - name: Install the WebDriver proxy (Linux)
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Make the portable package
        run: python apps/desktop/package.py | tee "$RECORDS/package-${{ runner.os }}.json"
      - name: Verify the package and run the user flows against the unpacked copy (Linux)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          archive=$(ls apps/desktop/dist/*.tar.gz)
          xvfb-run -a dbus-run-session -- python apps/desktop/verify_package.py "$archive" --run-flows --record "$RECORDS/package-check-Linux.json"
      - name: Report the WebView2 Runtime the window needs (Windows, read-only)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          # The first run of the flows on this runner found no page to drive. Before blaming the application,
          # print what the machine has: the registered Evergreen runtime versions and the runtime folders.
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($root in 'HKLM:\SOFTWARE\WOW6432Node', 'HKLM:\SOFTWARE', 'HKCU:\SOFTWARE') {
            $key = "$root\Microsoft\EdgeUpdate\Clients\$client"
            if (Test-Path $key) { "$key pv=$((Get-ItemProperty $key).pv)" } else { "$key : not registered" }
          }
          foreach ($dir in "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application") {
            if (Test-Path $dir) { "$dir : $((Get-ChildItem $dir -Name) -join ', ')" } else { "$dir : absent" }
          }
          "OS: $([Environment]::OSVersion.VersionString); interactive session: $([Environment]::UserInteractive); user: $env:USERNAME"
      - name: Verify the package and run the user flows against the unpacked copy (Windows)
        if: runner.os == 'Windows'
        run: |
          archive=$(ls apps/desktop/dist/*.zip)
          python apps/desktop/verify_package.py "$archive" --run-flows --record "$RECORDS/package-check-Windows.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop-records/
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.tar.gz
          if-no-files-found: warn
