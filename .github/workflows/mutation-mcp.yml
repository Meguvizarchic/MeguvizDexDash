name: MCP mutation check
# The MDD-042 mutation check applies 52 small faults to the MCP server, the service and the
# smali renderer, one at a time, and requires the unit tests, the process tests or the replays to
# catch each. It rebuilds and reruns the suites for every fault, so it takes about an hour: it
# runs here, on request, not on a developer machine and not on every push.
#
# Run it with:  gh workflow run mutation-mcp.yml
# The result is the artifact `mutation-mcp-results`; commit its contents as
# artifacts/mdd-042/mutation/results.txt without other changes. It is current for the commit it ran on and
# for every later commit that leaves the files it hashes unchanged.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install fixed validation environment
        run: python -m pip install -r requirements-dev.lock
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Fetch exact locked dependencies
        run: cargo fetch --locked
      - name: Build actual CLI
        run: cargo build --locked -p mdd-cli
      - name: Run the mutation check
        id: mutate
        continue-on-error: true
        shell: bash
        run: python -I artifacts/mdd-042/mutation/mutate_mcp.py | tee mutation-results.txt
      - name: Summarize
        if: always()
        run: |
          {
            echo '### MCP mutation check'
            echo
            echo "exit status of the check: ${{ steps.mutate.outcome }}"
            echo '```'
            cat mutation-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mutation-mcp-results
          path: mutation-results.txt
      - name: Fail when the check failed
        if: steps.mutate.outcome != 'success'
        run: exit 1
