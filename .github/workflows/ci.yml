name: Native build and conformance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Install fixed validation environment
        run: python -m pip install -r requirements-dev.lock
      - name: Install fixed Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Record compiler identity
        run: |
          rustc -Vv
          cargo -V
          python -V
      - name: Verify original handoff
        run: python tools/verify_original_handoff.py
      - name: Validate committed task/evidence checkpoint
        run: python tools/check_progress.py
      - name: Reproduce independent fixtures
        run: python conformance/oracles/reproduce.py
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Fetch exact locked dependencies
        run: cargo fetch --locked
      - name: Check dependency boundaries
        run: python conformance/check-workspace-boundaries.py
      - name: Check locked workspace
        run: python tools/record_command.py --output artifacts/ci/check -- cargo check --locked --workspace --all-targets
      - name: Lint
        run: python tools/record_command.py --output artifacts/ci/clippy -- cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test native implementation
        run: python tools/record_command.py --output artifacts/ci/test -- cargo test --locked --workspace
      - name: Build actual CLI
        run: python tools/record_command.py --output artifacts/ci/build -- cargo build --locked -p mdd-cli
      - name: Python SDK tests (library and worker transport)
        run: |
          cargo build --locked -p mdd-ffi -p mdd-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m unittest discover -s python/tests -t python
      - name: Check actual CLI contracts and inspection
        run: |
          $binary = if ($IsWindows) { 'target/debug/meguvizdexdash.exe' } else { 'target/debug/meguvizdexdash' }
          python conformance/check-cli-contract.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/check-inspection.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/cli/cli_cases.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/hostlab-b0-pipeline.py verify --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/mcp/golden_replay.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/fixtures/decode/generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/mcp/lifecycle_replay.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/decode/run_decode_conformance.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/mcp/manifest_replay.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/decode/a0_replay.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/decode/test_a0_replay.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/fixtures/decode/generate_class.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/decode/run_decode_full.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/decode/build_decode_contract.py --binary $binary --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/decode/test_decode_full.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/mcp/check_hostlab_required_tools.py --binary $binary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/mcp/test_hostlab_required_tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -m unittest discover -s integrations/hostlab -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I integrations/hostlab/make_provider_selection.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I integrations/hostlab/make_structural_equivalence.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I integrations/hostlab/remote_make_records.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tests/fixtures/surface/generate.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I conformance/hostlab/surface_import_sources.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I integrations/hostlab/surface_make_goldens.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I integrations/hostlab/surface_make_equivalence.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I artifacts/mdd-084/repro_or_chain_overflow.py --binary $binary --phase post --out artifacts/ci/mdd-084-repro-post.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I artifacts/mdd-084/build_record.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I benchmarks/test_producer_consumer_pipeline.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python conformance/mcp/test_replays.py
      - name: Run actual dependency and SQL probes
        run: python tools/record_command.py --output artifacts/ci/probe -- cargo run --locked -p mdd-build-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance-${{ matrix.os }}
          path: |
            artifacts/ci/
            artifacts/mdd-004/
          if-no-files-found: error
